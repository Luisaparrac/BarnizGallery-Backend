spring.application.name=barniz-gallery-backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.auction.currency=${AUCTION_CURRENCY:USD}
app.auction.min-increment=1
app.auction.max-bids-per-minute=5
app.auction.suspicious-multiplier=10
app.auction.scheduler-enabled=${AUCTION_SCHEDULER_ENABLED:true}
app.ai.provider=${AI_PROVIDER:none}
app.ai.api-key=${AI_API_KEY:}
app.hyper3d.api-key=${HYPER3D_API_KEY:}
app.hyper3d.base-url=${HYPER3D_BASE_URL:https://hyperhuman.deemos.com}
app.storage.provider=${STORAGE_PROVIDER:none}

springdoc.swagger-ui.path=/swagger-ui.html
