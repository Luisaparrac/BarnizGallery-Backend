spring.application.name=barniz-gallery-backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=museo
spring.sql.init.mode=never

# Flyway. The v1 schema already existed before Flyway was introduced, so the first run records it as
# baseline version 1 (the 12 v1 tables in public) and then applies V2, which archives them as
# public.museo_v1_* and creates the museo schema. flyway_schema_history lives in public.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.schemas=public
spring.flyway.default-schema=public

# JWT (HS256). JWT_SECRET is required: without it the application does not start.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-minutes=${JWT_ACCESS_MINUTES:15}
app.jwt.refresh-days=${JWT_REFRESH_DAYS:7}
# Failed logins allowed per email and IP inside the window (then 429 until the window ends).
app.security.login.max-attempts=5
app.security.login.window=15m

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.auction.currency=${AUCTION_CURRENCY:USD}
app.auction.min-increment=1
app.auction.max-bids-per-minute=5
app.auction.suspicious-multiplier=10
app.auction.scheduler-enabled=${AUCTION_SCHEDULER_ENABLED:true}
app.ai.provider=${AI_PROVIDER:none}
# Separate AI service (prices and recommendations). Empty URL or key = disabled, fixed rules are used.
ai.service.url=${AI_SERVICE_URL:}
ai.service.key=${AI_SERVICE_KEY:}
ai.service.timeout=10s
app.storage.provider=${STORAGE_PROVIDER:none}
# Cloudinary (photos). Empty credentials = upload disabled.
app.storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.storage.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.storage.cloudinary.base-url=https://api.cloudinary.com
app.storage.cloudinary.folder=museo
app.storage.cloudinary.timeout=30s
# Largest image accepted (the multipart limit is a bit higher so the API answers with its own error).
app.storage.max-upload-size=5MB
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

springdoc.swagger-ui.path=/swagger-ui.html
